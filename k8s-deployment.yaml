apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdp-deployment
  labels:
    app: sdp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdp-app
  template:
    metadata:
      labels:
        app: sdp-app
    spec:
      containers:
      - name: sdp-app
        image: sdp-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sdp-service
spec:
  type: NodePort
  selector:
    app: sdp-app
  ports:
    - port: 80
      targetPort: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mevi-web
  labels:
    app: mevi-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mevi-web
  template:
    metadata:
      labels:
        app: mevi-web
    spec:
      containers:
      - name: mevi-web
        image: mevi-web:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

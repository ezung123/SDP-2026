apiVersion: apps/v1
kind: Deployment
metadata:
  name: mevi-web-deployment
  labels:
    app: mevi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mevi-web
  template:
    metadata:
      labels:
        app: mevi-web
    spec:
      containers:
      - name: mevi-web
        image: mevi-webv1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mevi-web-service
spec:
  type: NodePort
  selector:
    app: mevi-web
  ports:
    - port: 80
      targetPort: 80
